name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt system libraries (headless)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon0 libxkbcommon-x11-0 \
            libegl1 libgl1 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"

      - name: Run the test-suite (offscreen Qt)
        run: pytest --color=yes
        env:
          QT_QPA_PLATFORM: offscreen

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff
        run: |
          pip install ruff
          ruff check calc tests
          ruff format --check calc tests
